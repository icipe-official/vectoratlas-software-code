name: Sync UAT Secrets to K3s

on:
  workflow_dispatch:

jobs:
  sync-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: latest

      - name: Decode kubeconfig and authenticate
        run: |
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > kubeconfig.yaml
          export KUBECONFIG=./kubeconfig.yaml
          cho "Kubeconfig content (first 10 lines):"
          head -n 4 $KUBECONFIG  # Print the first 10 lines of the kubeconfig file
          kubectl version --client
          kubectl get nodes

      - name: Create Kubernetes Secret from _UAT secrets
        env:
          ANALYTICS_ADMIN_PASSWORD_UAT: ${{ secrets.ANALYTICS_ADMIN_PASSWORD_UAT }}
          AUTH0_AUDIENCE_UAT: ${{ secrets.AUTH0_AUDIENCE_UAT }}
          AUTH0_BASE_URL_UAT: ${{ secrets.AUTH0_BASE_URL_UAT }}
          AUTH0_CLIENT_ID_API_UAT: ${{ secrets.AUTH0_CLIENT_ID_API_UAT }}
          AUTH0_CLIENT_ID_UAT: ${{ secrets.AUTH0_CLIENT_ID_UAT }}
          AUTH0_CLIENT_SECRET_API_UAT: ${{ secrets.AUTH0_CLIENT_SECRET_API_UAT }}
          AUTH0_CLIENT_SECRET_UAT: ${{ secrets.AUTH0_CLIENT_SECRET_UAT }}
          AUTH0_ISSUER_BASE_URL_UAT: ${{ secrets.AUTH0_ISSUER_BASE_URL_UAT }}
          AUTH0_ISSUER_URL_API_UAT: ${{ secrets.AUTH0_ISSUER_URL_API_UAT }}
          AUTH0_ISSUER_URL_UAT: ${{ secrets.AUTH0_ISSUER_URL_UAT }}
          AUTH0_SECRET_UAT: ${{ secrets.AUTH0_SECRET_UAT }}
          AZURE_STORAGE_CONNECTION_STRING_UAT: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING_UAT }}
          BASE_URL_UAT: ${{ secrets.BASE_URL_UAT }}
          DATABASE_URL_ANALYTICS_UAT: ${{ secrets.DATABASE_URL_ANALYTICS_UAT }}
          DATACITE_PREFIX_UAT: ${{ secrets.DATACITE_PREFIX_UAT }}
          DATACITE_URL_UAT: ${{ secrets.DATACITE_URL_UAT }}
          DATA_INGESTION_URL_UAT: ${{ secrets.DATA_INGESTION_URL_UAT }}
          DATA_VALIDATION_URL_UAT: ${{ secrets.DATA_VALIDATION_URL_UAT }}
          DEPLOYMENT_SERVER_UAT: ${{ secrets.DEPLOYMENT_SERVER_UAT }}
          DOI_PUBLISHER_UAT: ${{ secrets.DOI_PUBLISHER_UAT }}
          DOI_RESOLVER_BASE_URL_UAT: ${{ secrets.DOI_RESOLVER_BASE_URL_UAT }}
          EMAIL_FROM_UAT: ${{ secrets.EMAIL_FROM_UAT }}
          EMAIL_HOST_UAT: ${{ secrets.EMAIL_HOST_UAT }}
          EMAIL_PASSWORD_UAT: ${{ secrets.EMAIL_PASSWORD_UAT }}
          EMAIL_PORT_UAT: ${{ secrets.EMAIL_PORT_UAT }}
          EMAIL_SECURE_UAT: ${{ secrets.EMAIL_SECURE_UAT }}
          IMAP_PORT_UAT: ${{ secrets.IMAP_PORT_UAT }}
          IMAP_SERVER_UAT: ${{ secrets.IMAP_SERVER_UAT }}
          POSTGRES_DB_UAT: ${{ secrets.POSTGRES_DB_UAT }}
          POSTGRES_HOST_UAT: ${{ secrets.POSTGRES_HOST_UAT }}
          POSTGRES_PASSWORD_UAT: ${{ secrets.POSTGRES_PASSWORD_UAT }}
          POSTGRES_PORT_UAT: ${{ secrets.POSTGRES_PORT_UAT }}
          POSTGRES_USER_UAT: ${{ secrets.POSTGRES_USER_UAT }}
          SENT_EMAIL_FOLDER_UAT: ${{ secrets.SENT_EMAIL_FOLDER_UAT }}
          SSH_PRIVATE_KEY_UAT: ${{ secrets.SSH_PRIVATE_KEY_UAT }}
          SSH_USER_UAT: ${{ secrets.SSH_USER_UAT }}
          TEMP_DIR_UAT: ${{ secrets.TEMP_DIR_UAT }}
          TOKEN_KEY_UAT: ${{ secrets.TOKEN_KEY_UAT }}
        run: |
          kubectl delete secret uat-secrets --ignore-not-found

          kubectl create secret generic uat-secrets \
            --from-literal=ANALYTICS_ADMIN_PASSWORD_UAT="$ANALYTICS_ADMIN_PASSWORD_UAT" \
            --from-literal=AUTH0_AUDIENCE_UAT="$AUTH0_AUDIENCE_UAT" \
            --from-literal=AUTH0_BASE_URL_UAT="$AUTH0_BASE_URL_UAT" \
            --from-literal=AUTH0_CLIENT_ID_API_UAT="$AUTH0_CLIENT_ID_API_UAT" \
            --from-literal=AUTH0_CLIENT_ID_UAT="$AUTH0_CLIENT_ID_UAT" \
            --from-literal=AUTH0_CLIENT_SECRET_API_UAT="$AUTH0_CLIENT_SECRET_API_UAT" \
            --from-literal=AUTH0_CLIENT_SECRET_UAT="$AUTH0_CLIENT_SECRET_UAT" \
            --from-literal=AUTH0_ISSUER_BASE_URL_UAT="$AUTH0_ISSUER_BASE_URL_UAT" \
            --from-literal=AUTH0_ISSUER_URL_API_UAT="$AUTH0_ISSUER_URL_API_UAT" \
            --from-literal=AUTH0_ISSUER_URL_UAT="$AUTH0_ISSUER_URL_UAT" \
            --from-literal=AUTH0_SECRET_UAT="$AUTH0_SECRET_UAT" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING_UAT="$AZURE_STORAGE_CONNECTION_STRING_UAT" \
            --from-literal=BASE_URL_UAT="$BASE_URL_UAT" \
            --from-literal=DATABASE_URL_ANALYTICS_UAT="$DATABASE_URL_ANALYTICS_UAT" \
            --from-literal=DATACITE_PREFIX_UAT="$DATACITE_PREFIX_UAT" \
            --from-literal=DATACITE_URL_UAT="$DATACITE_URL_UAT" \
            --from-literal=DATA_INGESTION_URL_UAT="$DATA_INGESTION_URL_UAT" \
            --from-literal=DATA_VALIDATION_URL_UAT="$DATA_VALIDATION_URL_UAT" \
            --from-literal=DEPLOYMENT_SERVER_UAT="$DEPLOYMENT_SERVER_UAT" \
            --from-literal=DOI_PUBLISHER_UAT="$DOI_PUBLISHER_UAT" \
            --from-literal=DOI_RESOLVER_BASE_URL_UAT="$DOI_RESOLVER_BASE_URL_UAT" \
            --from-literal=EMAIL_FROM_UAT="$EMAIL_FROM_UAT" \
            --from-literal=EMAIL_HOST_UAT="$EMAIL_HOST_UAT" \
            --from-literal=EMAIL_PASSWORD_UAT="$EMAIL_PASSWORD_UAT" \
            --from-literal=EMAIL_PORT_UAT="$EMAIL_PORT_UAT" \
            --from-literal=EMAIL_SECURE_UAT="$EMAIL_SECURE_UAT" \
            --from-literal=IMAP_PORT_UAT="$IMAP_PORT_UAT" \
            --from-literal=IMAP_SERVER_UAT="$IMAP_SERVER_UAT" \
            --from-literal=POSTGRES_DB_UAT="$POSTGRES_DB_UAT" \
            --from-literal=POSTGRES_HOST_UAT="$POSTGRES_HOST_UAT" \
            --from-literal=POSTGRES_PASSWORD_UAT="$POSTGRES_PASSWORD_UAT" \
            --from-literal=POSTGRES_PORT_UAT="$POSTGRES_PORT_UAT" \
            --from-literal=POSTGRES_USER_UAT="$POSTGRES_USER_UAT" \
            --from-literal=SENT_EMAIL_FOLDER_UAT="$SENT_EMAIL_FOLDER_UAT" \
            --from-literal=SSH_PRIVATE_KEY_UAT="$SSH_PRIVATE_KEY_UAT" \
            --from-literal=SSH_USER_UAT="$SSH_USER_UAT" \
            --from-literal=TEMP_DIR_UAT="$TEMP_DIR_UAT" \
            --from-literal=TOKEN_KEY_UAT="$TOKEN_KEY_UAT"
