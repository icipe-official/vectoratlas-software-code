name: Build and Push Docker Images

on:
  push:
    branches:
      - main  # Replace with the branch you want to trigger this workflow
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Define directories and image names
          directories=("src/API" "src/UI" "src/HELP" "src/TileServer" "src/Docker/umami" "src/IngestionApi" "src/Docker/nginx")
          for dir in "${directories[@]}"; do
            # Extract image name from directory structure
            image_name=$(echo "$dir" | tr '/' '-')
            full_image_name="ghcr.io/${{ github.repository_owner }}/${image_name}:${IMAGE_TAG}"
            
            echo "Building image for $dir..."
            docker build -t "$full_image_name" "$dir"
            
            echo "Pushing image $full_image_name..."
            docker push "$full_image_name"
          done
