name: Build and Push Docker Images

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push UI Image (if changed)
        id: build-ui
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.head_ref, 'ui')) }}
        run: |
          if [[ -n "$(git diff --shortstat --cached -- 'src/UI')" ]]; then
            echo "Changes detected in src/UI"
            IMAGE_TAG=${{ github.sha }}
            image_name=ui
            full_image_name="ghcr.io/${{ github.repository_owner }}/${image_name}:${IMAGE_TAG}"
            docker build -t "$full_image_name" "src/UI"
            docker push "$full_image_name"
          else
            echo "No changes detected in src/UI"
          fi

      - name: Build and Push API Image (if changed)
        id: build-api
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.head_ref, 'api')) }}
        run: |
          if [[ -n "$(git diff --shortstat --cached -- 'src/API')" ]]; then
            echo "Changes detected in src/API"
