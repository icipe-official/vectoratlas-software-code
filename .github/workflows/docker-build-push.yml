name: CI and Docker Build

on:
  push:
    branches: [ "main", "test" ]
    paths:
      - src/API/**
      - src/UI/**
      - .github/**
  pull_request:
    branches: [ "main", "test" ]
    paths:
      - src/API/**
      - src/UI/**
      - .github/**

jobs:
  api-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/API
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  ui-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/UI
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  docker-api:
    runs-on: ubuntu-latest
    needs: api-ci
    steps:
      - uses: actions/checkout@v3
      - name: Build and push API image
        run: |
          docker build -t your-api-image:tag src/API
          docker push your-api-image:tag

  docker-ui:
    runs-on: ubuntu-latest
    needs: ui-ci
    steps:
      - uses: actions/checkout@v3
      - name: Build and push UI image
        run: |
          docker build -t your-ui-image:tag src/UI
          docker push your-ui-image:tag
