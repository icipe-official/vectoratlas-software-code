name: Build and Push Docker Images

on:
  push:
    branches:
      - test
  pull_request:
    types: [closed]
    branches:
      - test
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check for changes'
        required: true
        default: 'test'
      services:
        description: 'Comma-separated list of services to build (e.g., ui,api,help,tileserver,umami,ingestionapi,nginx) or "all"'
        required: true
        default: 'all'

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/test') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'test') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set Diff Range
        id: diff-range
        run: |
               if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.merged }}" == "true" ]]; then
                    # We're now on the merged branch (e.g., test). Use HEAD and HEAD^1.
                    echo "HEAD_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
                    echo "BASE_SHA=$(git rev-parse HEAD^1)" >> $GITHUB_ENV
               elif [[ "${{ github.event_name }}" == "push" ]]; then
                    echo "HEAD_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
                    echo "BASE_SHA=$(git rev-parse HEAD^1)" >> $GITHUB_ENV
               else
                    echo "HEAD_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
                    echo "BASE_SHA=$(git rev-parse HEAD^1)" >> $GITHUB_ENV
               fi

      - name: Detect Changed Services
        id: detect-changes
        run: |
          declare -A SERVICES=(
            ["ui"]="src/UI"
            ["api"]="src/API"
            ["help"]="src/Help"
            ["tileserver"]="src/TileServer"
            ["umami"]="src/Docker/umami"
            ["ingestionapi"]="src/IngestionAPI"
            ["nginx"]="src/Docker/nginx"
          )
          CHANGED_SERVICES=""
          for service in "${!SERVICES[@]}"; do
            if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q "^${SERVICES[$service]}/"; then
              CHANGED_SERVICES+="$service,"
            fi
          done
          echo "changed_services=${CHANGED_SERVICES%,}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Images
        run: |
          declare -A SERVICES=(
            ["ui"]="src/UI"
            ["api"]="src/API"
            ["help"]="src/Help"
            ["tileserver"]="src/TileServer"
            ["umami"]="src/Docker/umami"
            ["ingestionapi"]="src/IngestionAPI"
            ["nginx"]="src/Docker/nginx"
          )

          SELECTED="${{ steps.detect-changes.outputs.changed_services }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SELECTED="${{ github.event.inputs.services }}"
            if [[ "$SELECTED" == "all" ]]; then
              SELECTED=$(IFS=','; echo "${!SERVICES[*]}" | tr ' ' ',')
            fi
          fi

          IFS=',' read -ra TO_BUILD <<< "$SELECTED"
          SHORT_SHA=$(git rev-parse --short HEAD)

          cd src
          chmod +x buildVersionFiles.sh
          ./buildVersionFiles.sh
          cd ..

          for image_name in "${TO_BUILD[@]}"; do
            image_name=$(echo "$image_name" | xargs) # <- this trims spaces
            dir="${SERVICES[$image_name]}"
            echo "Building and pushing $image_name from $dir"
            LATEST_TAG="ghcr.io/${{ github.repository_owner }}/${image_name}:latest"
            SHA_TAG="ghcr.io/${{ github.repository_owner }}/${image_name}:${SHORT_SHA}"

            if [[ "$image_name" == "ui" ]]; then
              docker build \
                --build-arg NEXT_PUBLIC_TOKEN_KEY="${{ secrets.TOKEN_KEY_UAT }}" \
                --no-cache \
                -t "$LATEST_TAG" -t "$SHA_TAG" "$dir"
            else
              docker build -t "$LATEST_TAG" -t "$SHA_TAG" "$dir"
            fi

            docker push "$LATEST_TAG"
            docker push "$SHA_TAG"
          done
