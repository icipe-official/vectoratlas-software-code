name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check for changes'
        required: true
        default: 'test'
      services:
        description: 'Comma-separated list of services to build (e.g., ui,api,help,tileserver,umami,ingestionapi,nginx) or "all"'
        required: true
        default: 'all'

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1  # Keep it shallow
          ref: ${{ github.event.inputs.branch }}
      - name: Fetch Latest Commits 
        run: |
          git pull origin ${{ github.event.inputs.branch }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Branch
        id: branch-info
        run: echo "branch=${{ github.event_name == 'push' && github.ref_name || github.event.inputs.branch }}" >> $GITHUB_ENV

      - name: Build and Push Images
        run: |
          declare -A SERVICES=(
            ["ui"]="src/UI"
            ["api"]="src/API"
            ["help"]="src/Help"
            ["tileserver"]="src/TileServer"
            ["umami"]="src/Docker/umami"
            ["ingestionapi"]="src/IngestionAPI"
            ["nginx"]="src/Docker/nginx"
          )

          # Default to "all" if running on push
          SELECTED_SERVICES="${{ github.event.inputs.services || 'all' }}"

          build_and_push() {
            local image_name=$1
            local dir=$2

            if [[ "$SELECTED_SERVICES" != "all" && ! "$SELECTED_SERVICES" =~ (^|,)$image_name(,|$) ]]; then
              echo "Skipping $image_name (not in selected services)"
              return
            fi

            echo "Building and pushing $image_name from $dir"
            IMAGE_TAG=latest
            full_image_name="ghcr.io/${{ github.repository_owner }}/${image_name}:${IMAGE_TAG}"

            # If building ui, pass NEXT_PUBLIC_TOKEN_KEY as an environment variable
            if [[ "$image_name" == "ui" ]]; then
              echo "Passing NEXT_PUBLIC_TOKEN_KEY as an environment variable for ui"
              docker build \
              --build-arg NEXT_PUBLIC_TOKEN_KEY="${{ secrets.TOKEN_KEY_UAT }}" \
               --no-cache \
              -t "$full_image_name" "$dir"
            else
              docker build -t "$full_image_name" "$dir"
            fi

            docker push "$full_image_name"
          }

          cd src
          chmod +x buildVersionFiles.sh
          ./buildVersionFiles.sh
          cd ..
          for image_name in "${!SERVICES[@]}"; do
            build_and_push "$image_name" "${SERVICES[$image_name]}"
          done
