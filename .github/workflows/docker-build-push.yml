name: Build and Push Docker Images

on:
  push:
    branches:
      - test
  workflow_dispatch:  # Allows manual trigger
    inputs:
      branch:
        description: 'Branch to check for changes'
        required: true
        default: 'test'

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2  # Fetches the previous commit for comparison

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Images (if changed)
        run: |
          declare -A SERVICES=(
            ["ui"]="src/UI"
            ["api"]="src/API"
            ["help"]="src/HELP"
            ["tileserver"]="src/TileServer"
            ["umami"]="src/Docker/umami"
            ["ingestionapi"]="src/IngestionApi"
            ["nginx"]="src/Docker/nginx"
          )

          # Determine branch for comparison
          BRANCH=${{ github.event_name == 'push' && github.ref_name || github.event.inputs.branch }}
          
          git fetch origin "$BRANCH"

          for image_name in "${!SERVICES[@]}"; do
            dir="${SERVICES[$image_name]}"

            # Check if there are changes in the directory
            if git diff --quiet origin/"$BRANCH"..HEAD -- "$dir"; then
              echo "No changes detected in $dir"
            else
              echo "Changes detected in $dir"
              IMAGE_TAG="latest"
              full_image_name="ghcr.io/${{ github.repository_owner }}/${image_name}:${IMAGE_TAG}"
              
              docker build -t "$full_image_name" "$dir"
              docker push "$full_image_name"
            fi
          done

