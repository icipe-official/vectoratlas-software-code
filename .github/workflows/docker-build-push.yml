name: Build and Push Docker Images

on:
  push:
    branches:
      - test
  pull_request:
    types: [closed]
    branches:
      - test
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check for changes'
        required: true
        default: 'test'
      services:
        description: 'Comma-separated list of services to build (e.g., ui,api,help,tileserver,umami,ingestionapi,nginx) or "all"'
        required: true
        default: 'all'

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      changed_services: ${{ steps.detect-changes.outputs.changed_services }}
      api_changed: ${{ steps.detect-changes.outputs.api_changed }}
      ui_changed: ${{ steps.detect-changes.outputs.ui_changed }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set Diff Range
        id: diff-range
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.merged }}" == "true" ]]; then
            echo "HEAD_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
            echo "BASE_SHA=$(git rev-parse HEAD^1)" >> $GITHUB_ENV
          else
            echo "HEAD_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
            echo "BASE_SHA=$(git rev-parse HEAD^1)" >> $GITHUB_ENV
          fi

      - name: Detect Changed Services
        id: detect-changes
        run: |
          declare -A SERVICES=(
            ["ui"]="src/UI"
            ["api"]="src/API"
            ["help"]="src/Help"
            ["tileserver"]="src/TileServer"
            ["umami"]="src/Docker/umami"
            ["ingestionapi"]="src/IngestionAPI"
            ["nginx"]="src/Docker/nginx"
          )
          CHANGED_SERVICES=""
          API_CHANGED="false"
          UI_CHANGED="false"

          for service in "${!SERVICES[@]}"; do
            if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q "^${SERVICES[$service]}/"; then
              CHANGED_SERVICES+="$service,"
              if [[ "$service" == "api" ]]; then API_CHANGED="true"; fi
              if [[ "$service" == "ui" ]]; then UI_CHANGED="true"; fi
            fi
          done

          echo "changed_services=${CHANGED_SERVICES%,}" >> $GITHUB_OUTPUT
          echo "api_changed=$API_CHANGED" >> $GITHUB_OUTPUT
          echo "ui_changed=$UI_CHANGED" >> $GITHUB_OUTPUT

  api-ci:
    name: API CI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api_changed == 'true'
    defaults:
      run:
        working-directory: src/API
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  ui-ci:
    name: UI CI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.ui_changed == 'true'
    defaults:
      run:
        working-directory: src/UI
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [detect-changes, api-ci, ui-ci]
    if: |
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.changed_services != ''
      ) &&
      (
        needs.api-ci.result != 'failure' &&
        needs.ui-ci.result != 'failure'
      )
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Images
        run: |
          declare -A SERVICES=(
            ["ui"]="src/UI"
            ["api"]="src/API"
            ["help"]="src/Help"
            ["tileserver"]="src/TileServer"
            ["umami"]="src/Docker/umami"
            ["ingestionapi"]="src/IngestionAPI"
            ["nginx"]="src/Docker/nginx"
          )

          SELECTED="${{ needs.detect-changes.outputs.changed_services }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SELECTED="${{ github.event.inputs.services }}"
            if [[ "$SELECTED" == "all" ]]; then
              SELECTED=$(IFS=','; echo "${!SERVICES[*]}" | tr ' ' ',')
            fi
          fi

          IFS=',' read -ra TO_BUILD <<< "$SELECTED"
          SHORT_SHA=$(git rev-parse --short HEAD)

          cd src
          chmod +x buildVersionFiles.sh
          ./buildVersionFiles.sh
          cd ..

          for image_name in "${TO_BUILD[@]}"; do
            dir="${SERVICES[$image_name]}"
            echo "Building and pushing $image_name from $dir"
            LATEST_TAG="ghcr.io/${{ github.repository_owner }}/${image_name}:latest"
            SHA_TAG="ghcr.io/${{ github.repository_owner }}/${image_name}:${SHORT_SHA}"
            if [[ "$image_name" == "ui" ]]; then
              docker build \
                --build-arg NEXT_PUBLIC_TOKEN_KEY="${{ secrets.TOKEN_KEY_UAT }}" \
                --no-cache \
                -t "$LATEST_TAG" -t "$SHA_TAG" "$dir"
            else
              docker build -t "$LATEST_TAG" -t "$SHA_TAG" "$dir"
            fi
            docker push "$LATEST_TAG"
            docker push "$SHA_TAG"
          done
  update-configs:
                name: Update Values YAML with SHA Tags
                runs-on: ubuntu-latest
                needs: build-and-push
                if: always() # Keep this as 'always()' for now until we fully confirm it works

                # NOTE: This 'permissions' block only applies to the default GITHUB_TOKEN
                # For pushing to a different repository, you need a PAT secret below.
                permissions:
                  contents: write # This is for actions in THIS repository (if you were pushing here)

                steps:
                  - name: Checkout VA-Cube-Configs repository
                    uses: actions/checkout@v4
                    with:
                      # --- IMPORTANT CHANGES HERE ---
                      repository: icipe-official/VA-Cube-Configs # Specify the OTHER repository
                      token: ${{ secrets.REPO_ACCESS_TOKEN }} # Use a Personal Access Token (PAT) here
                      path: VA-Cube-Configs # Checkout this repo into a sub-directory named 'VA-Cube-Configs'
                      fetch-depth: 0

                  - name: Set up YQ (YAML processor)
                    run: |
                      sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq && sudo chmod +x /usr/local/bin/yq

                  - name: Update values.yaml with new SHA Tags
                    run: |
                      set -euo pipefail
                      updated_any=0 

                      CURRENT_COMMIT_SHORT_SHA="${{ needs.build-and-push.outputs.short_sha }}"
                      echo "Current commit SHA for updates: ${CURRENT_COMMIT_SHORT_SHA}"

                      declare -a SERVICES_TO_UPDATE=("api" "dbMigrations" "help" "ingestionapi" "tileserver" "ui" "umami")
                      
                      for img_key in "${SERVICES_TO_UPDATE[@]}"; do
                        yq_path=".images.${img_key}.tag" 
                        
                        # --- IMPORTANT PATH CHANGE: Reference values.yaml inside the checked-out path ---
                        EXISTING_TAG=$(yq e "${yq_path}" VA-Cube-Configs/values.yaml || echo "NOT_FOUND")

                        if [[ "$EXISTING_TAG" != "$CURRENT_COMMIT_SHORT_SHA" ]]; then
                          echo "Updating ${yq_path} from '${EXISTING_TAG}' to '${CURRENT_COMMIT_SHORT_SHA}'"
                          # --- IMPORTANT PATH CHANGE: Reference values.yaml inside the checked-out path ---
                          yq e "${yq_path} = \"${CURRENT_COMMIT_SHORT_SHA}\"" -i VA-Cube-Configs/values.yaml
                          updated_any=1
                        else
                          echo "${img_key} tag in values.yaml is already up to date: ${CURRENT_COMMIT_SHORT_SHA}"
                        fi
                      done

                      if [ "$updated_any" -eq 1 ]; then
                        echo "Changes detected in values.yaml. Committing and pushing."
                        git config user.name "github-actions[bot]"
                        git config user.email "github-actions[bot]@users.noreply.github.com"
                        
                        # --- IMPORTANT: Change directory to the checked-out repo before git commands ---
                        cd VA-Cube-Configs 
                        
                        git add values.yaml
                        git commit -m "chore(deps): Update image tags to latest SHAs" || echo "No changes to commit"
                        
                        # --- IMPORTANT: Push using the PAT to the other repository ---
                        # Assuming you want to push to the 'test' branch of VA-Cube-Configs
                        git push https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/icipe-official/VA-Cube-Configs.git HEAD:test 
                      else
                        echo "No image tag updates required."
                      fi

