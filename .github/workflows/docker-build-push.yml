name: Build and Push Docker Images

on:
  push:
    branches:
      - test
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check for changes'
        required: true
        default: 'test'
      services:
        description: 'Comma-separated list of services to build (e.g., ui,api,help) or "all"'
        required: true
        default: 'all'

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2  # Fetch previous commit for comparison

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Branch
        id: branch-info
        run: echo "branch=${{ github.event_name == 'push' && github.ref_name || github.event.inputs.branch }}" >> $GITHUB_ENV

      - name: Build and Push Images (if changed or requested)
        run: |
          declare -A SERVICES=(
            ["ui"]="src/UI"
            ["api"]="src/API"
            ["help"]="src/HELP"
            ["tileserver"]="src/TileServer"
            ["umami"]="src/Docker/umami"
            ["ingestionapi"]="src/IngestionApi"
            ["nginx"]="src/Docker/nginx"
          )

          # Get services list from input
          SELECTED_SERVICES="${{ github.event.inputs.services }}"
          
          # Determine branch
          BRANCH=${{ env.branch }}

          git fetch origin "$BRANCH"

          # Function to build and push a service
          build_and_push() {
            local image_name=$1
            local dir=$2

            if [[ "$SELECTED_SERVICES" != "all" && ! "$SELECTED_SERVICES" =~ (^|,)$image_name(,|$) ]]; then
              echo "Skipping $image_name (not in selected services)"
              return
            fi

            if git diff --quiet origin/"$BRANCH"..HEAD -- "$dir"; then
              echo "No changes detected in $dir"
            else
              echo "Changes detected in $dir"
              IMAGE_TAG=${{ github.sha }}
              full_image_name="ghcr.io/${{ github.repository_owner }}/${image_name}:${IMAGE_TAG}"
              
              docker build -t "$full_image_name" "$dir"
              docker push "$full_image_name"
            fi
          }

          for image_name in "${!SERVICES[@]}"; do
            build_and_push "$image_name" "${SERVICES[$image_name]}"
          done
