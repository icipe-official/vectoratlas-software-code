            docker push "$full_image_name"
          else
            echo "No changes detected in src/Docker/umami"
          fi

      - name: Build and Push IngestionApi Image (if changed)
        id: build-ingestionapi
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.head_ref, 'ingestionapi')) }}
