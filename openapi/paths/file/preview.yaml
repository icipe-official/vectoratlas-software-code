# Get Preview Endpoint
# Gets preview information for a file

paths:
  /files/{fileIdentifier}/preview:
    get:
      tags:
        - File
      summary: Get file preview information
      description: |
        Returns preview information for a file, including download URLs and metadata about available previews.
        The identifier can be either a UUID or a slug.
        
        Example request:
        GET /api/files/123e4567-e89b-12d3-a456-426614174000/preview
      operationId: getFilePreview
      parameters:
        - $ref: ../../parameters/file/file_identifier.yaml#/components/parameters/FileIdentifier
      responses:
        "200":
          description: Preview information
          content:
            application/json:
              schema:
                type: object
                required:
                  - file_id
                  - preview
                properties:
                  file_id:
                    type: string
                    format: uuid
                    description: ID of the original file
                  preview:
                    $ref: ../../schemas/file/file_preview.yaml#/components/schemas/FilePreview
                example:
                  file_id: "123e4567-e89b-12d3-a456-426614174000"
                  preview:
                    id: "323e4567-e89b-12d3-a456-426614174002"
                    file_id: "123e4567-e89b-12d3-a456-426614174000"
                    mime_type: "image/png"
                    size: 102400
                    created_on: "2023-01-15T10:32:00Z"
                    slug: "mosquito_occurrence_2023_thumbnail"
                    preview_type: "thumbnail"
                    download_url: "https://api.vectoratlas.org/files/123e4567-e89b-12d3-a456-426614174000/preview/download"
        "401":
          $ref: ../../responses/common/error.yaml#/components/responses/Unauthorized
        "404":
          $ref: ../../responses/common/error.yaml#/components/responses/NotFound
        "500":
          $ref: ../../responses/common/error.yaml#/components/responses/ServerError
