# Common Pagination Parameters

components:
  parameters:
    Page:
      name: page
      in: query
      description: The page number to return (1-based indexing)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    PageSize:
      name: pageSize
      in: query
      description: The number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 10
      example: 10
