# File Preview Schema
# Represents a preview version of a file

components:
  schemas:
    FilePreview:
      type: object
      required:
        - id
        - file_id
        - mime_type
        - size
        - created_on
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the preview file
          example: "323e4567-e89b-12d3-a456-426614174002"
        file_id:
          type: string
          format: uuid
          description: ID of the original file this is a preview of
          example: "123e4567-e89b-12d3-a456-426614174000"
        mime_type:
          type: string
          description: MIME type of the preview file
          example: "image/png"
        size:
          type: integer
          minimum: 0
          description: Size of the preview file in bytes
          example: 102400
        created_on:
          type: string
          format: date-time
          description: When the preview file was created
          example: "2023-01-15T10:32:00Z"
        slug:
          type: [string, "null"]
          description: Short unique name for URL-friendly access. Can be null
          example: "mosquito_occurrence_2023_thumbnail"
        preview_type:
          type: string
          description: Type of preview (thumbnail, small, medium, large)
          example: "thumbnail"
        download_url:
          type: string
          format: uri
          description: URL to download the preview file
          example: "https://api.vectoratlas.org/files/123e4567-e89b-12d3-a456-426614174000/preview/download"
      example:
        id: "323e4567-e89b-12d3-a456-426614174002"
        file_id: "123e4567-e89b-12d3-a456-426614174000"
        mime_type: "image/png"
        size: 102400
        created_on: "2023-01-15T10:32:00Z"
        slug: "mosquito_occurrence_2023_thumbnail"
        preview_type: "thumbnail"