version: "3.8"
services:
  db:
    build:
      context: ../Database
      dockerfile: Dockerfile
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER_UAT}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_UAT}
      - POSTGRES_DB=${POSTGRES_DB_UAT}
    ports:
      - "5432:5432"
    networks:
      - va-network-uat
    volumes:
      - postgres-data:/var/lib/postgresql/data
  db-migrations:
    image: ghcr.io/icipe-official/api:latest
    entrypoint: ["npm", "run", "migrations:runallprod"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER_UAT}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_UAT}
      - POSTGRES_DB=${POSTGRES_DB_UAT}
      # - POSTGRES_USER=$VA_DB_USER
      # - POSTGRES_PASSWORD=$VA_DB_PASSWORD
      - POSTGRES_HOST=${POSTGRES_HOST_UAT}
      # - POSTGRES_DB=postgres
      - DB_ENCRYPT_CONNECTION=true
    depends_on:
      - db
    links:
      - db:db
    networks:
      - va-network-uat
  api:
    image: ghcr.io/icipe-official/api:latest
    entrypoint: ["node", "dist/src/main.js"]
    restart: always
    volumes:
      - ../API/public:/usr/src/app/dist/public
      - /etc/vector-atlas/api:/etc/vector-atlas/api
      - ../TileServer/data:/data
    environment:
      # - POSTGRES_USER=$VA_DB_USER
      # - POSTGRES_PASSWORD=$VA_DB_PASSWORD
      - POSTGRES_USER=${POSTGRES_USER_UAT}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_UAT}
      - POSTGRES_HOST=${POSTGRES_HOST_UAT}
      - POSTGRES_DB=${POSTGRES_DB_UAT}
      - DB_ENCRYPT_CONNECTION=false
      - PUBLIC_FOLDER=/usr/src/app/dist
      - CONFIG_FOLDER=/etc/vector-atlas/api
      # - TOKEN_KEY=$VA_TOKEN_SECRET
      - TILESERVER_DATA_FOLDER=/data/
      - OVERLAY_BLOB_FOLDER=/data/blobStore/
      # - AZURE_STORAGE_CONNECTION_STRING=$AZURE_STORAGE_CONNECTION_STRING
      # - EMAIL_PASSWORD=$EMAIL_PASSWORD
      # - AUTH0_CLIENT_SECRET=$AUTH0_CLIENT_SECRET
      # - ANALYTICS_ADMIN_PASSWORD=$ANALYTICS_ADMIN_PASSWORD
      - ANALYTICS_ADMIN_PASSWORD=${ANALYTICS_ADMIN_PASSWORD_UAT}
      - ANALYTICS_API_URL="http://analytics:3000/analytics/api"
      - NEXT_PUBLIC_ANALYTICS_ID="2b3b6da0-3e75-4d9e-be86-d588496a174e"
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE_UAT}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID_API_UAT}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET_API_UAT}
      - AUTH0_ISSUER_URL=${AUTH0_ISSUER_BASE_URL_UAT}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING_UAT}
      - BASE_URL=${BASE_URL_UAT}
      - DATACITE_PASSWORD=${DATACITE_PASSWORD}
      - DATACITE_PREFIX=${DATACITE_PREFIX_UAT}
      - DATACITE_URL=${DATACITE_URL_UAT}
      - DATACITE_USER=${DATACITE_USER}
      - DATA_INGESTION_URL=${DATA_INGESTION_URL_UAT}
      - DATA_VALIDATION_URL=${DATA_VALIDATION_URL_UAT}
      - DOI_PUBLISHER=${DOI_PUBLISHER_UAT}
      - DOI_RESOLVER_BASE_URL=${DOI_RESOLVER_BASE_URL_UAT}
      - EMAIL_FROM=${EMAIL_FROM_UAT}
      - EMAIL_HOST=${EMAIL_HOST_UAT}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD_UAT}
      - EMAIL_PORT=${EMAIL_PORT_UAT}
      - EMAIL_SECURE=${EMAIL_SECURE_UAT}
      - IMAP_PORT=${IMAP_PORT_UAT}
      - IMAP_SERVER=${IMAP_SERVER_UAT}
      - SENT_EMAIL_FOLDER=${SENT_EMAIL_FOLDER_UAT}
      - TEMP_DIR=${TEMP_DIR_UAT}
      - TOKEN_KEY=${TOKEN_KEY_UAT}
      - NEXT_PUBLIC_AUTH_ENDPOINT="http://api:3001/auth/token"
      - NEXT_PUBLIC_TOKEN_KEY=${TOKEN_KEY_UAT}
      - FILE_STORAGE_TYPE=${FILE_STORAGE_TYPE}
    depends_on:
      - db-migrations
    links:
      - db:db
    networks:
      - va-network-uat
  ui:
    image: ghcr.io/icipe-official/ui:latest
    entrypoint: ["node", "server.js"]
    restart: always
    environment:
      - API_URL=api
      # - NEXT_PUBLIC_TOKEN_KEY=$VA_TOKEN_SECRET
      - NEXT_PUBLIC_TOKEN_KEY=${TOKEN_KEY_UAT}
      - NEXT_PUBLIC_AUTH_ENDPOINT="http://api:3001/auth/token"
      # - NEXT_PUBLIC_AUTH_ENDPOINT="http://localhost:3001/auth/token"
      - AUTH0_SECRET=${AUTH0_SECRET_UAT}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE_UAT}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID_UAT}
      - AUTH0_ISSUER_BASE_URL=${AUTH0_ISSUER_BASE_URL_UAT}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET_UAT}
      - AUTH0_BASE_URL=${AUTH0_BASE_URL_UAT}

    depends_on:
      - api
    links:
      - api:api
    networks:
      - va-network-uat
  help:
    image: ghcr.io/icipe-official/help:latest
    networks:
      - va-network-uat
    entrypoint: ["nginx", "-g", "daemon off;"]
    restart: always
  tileserver:
    image: ghcr.io/icipe-official/tileserver:latest
    volumes:
      - ../TileServer/data:/data
    networks:
      - va-network-uat
    restart: always
  analytics:
    image: ghcr.io/icipe-official/docker-umami:latest
    environment:
      # DATABASE_URL: $VA_DB_URL
      DATABASE_URL: ${DATABASE_URL_ANALYTICS_UAT}
      DATABASE_TYPE: postgresql
      BASE_PATH: /analytics
      CLIENT_IP_HEADER: "x-original-ip"
    restart: always
    networks:
      - va-network-uat
  nginx-proxy:
    depends_on:
      - ui
      - api
      - help
      - tileserver
      - analytics
    image: ghcr.io/icipe-official/docker-nginx:latest
    ports:
      - 3003:80
    networks:
      - va-network-uat
    restart: always
  python-backend:
    restart: unless-stopped
    image: ghcr.io/icipe-official/ingestionapi:latest
    environment:
     - POSTGRES_DB= ${POSTGRES_DB_UAT}
     - POSTGRES_USER= ${POSTGRES_USER_UAT}
     - POSTGRES_PASSWORD= ${POSTGRES_PASSWORD_UAT}
     - POSTGRES_HOST= ${POSTGRES_HOST_UAT}
     - POSTGRES_PORT= ${POSTGRES_PORT_UAT}

    ports:
      - 8090:8000
    depends_on:
      - db
    links:
      - db:db
    networks:
      - va-network-uat
networks:
  va-network-uat:

volumes:
  postgres-data:
